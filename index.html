<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>霖今天学了吗</title>
<style>
  :root{
    --bg:#f6f4ef;
    --card:#ffffff;
    --ink:#2c2a26;
    --sub:#8a857c;
    --line:#e8e3da;
    --accent:#6c8cff;
    --accent2:#ff9f6b;
    --green:#4bb98a;
    --shadow:0 6px 24px rgba(60,50,30,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  header{
    padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .today{font-size:12px;color:var(--sub)}
  main{
    flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 90px;
    -webkit-overflow-scrolling:touch;
  }
  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);
  }
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:6px}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .muted{color:var(--sub);font-size:12px}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    background:#fbfaf7;width:100%;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
  button{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:none;border-radius:12px;padding:11px 16px;transition:.15s;
    color:#fff;background:var(--accent);
  }
  button:active{transform:scale(.97)}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  button.warm{background:var(--accent2)}
  button.green{background:var(--green)}
  .row{display:flex;gap:8px;align-items:center}
  .row > *{flex:1}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:7px 13px;border-radius:20px;font-size:13px;background:#f0ede6;
    color:var(--sub);cursor:pointer;border:1px solid transparent;transition:.15s;
  }
  .chip.on{background:var(--accent);color:#fff}
  /* 任务列表 */
  .task{
    display:flex;gap:10px;align-items:flex-start;padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .task:last-child{border-bottom:none}
  .task .check{
    width:22px;height:22px;border-radius:8px;border:2px solid var(--line);
    flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:13px;transition:.15s;
  }
  .task.done .check{background:var(--green);border-color:var(--green)}
  .task.done .t-name{text-decoration:line-through;color:var(--sub)}
  .t-body{flex:1;min-width:0}
  .t-name{font-size:14px;word-break:break-word}
  .t-meta{font-size:11px;color:var(--sub);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
  .t-meta .urgent{color:#e0584f;font-weight:600}
  .del{background:none;color:#c9c4ba;font-size:18px;padding:0 4px;line-height:1}
  /* 番茄钟 */
  .timer-wrap{text-align:center;padding:6px 0}
  .timer-num{font-size:44px;font-weight:800;letter-spacing:2px;color:var(--ink)}
  .timer-mode{font-size:13px;color:var(--sub);margin-bottom:10px}
  .timer-ctrl{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .stat{background:#fbfaf7;border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--sub)}
  /* 课表 */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
  .week div{text-align:center;font-size:12px;padding:7px 0;border-radius:10px;
    background:#f0ede6;color:var(--sub);cursor:pointer}
  .week div.on{background:var(--accent);color:#fff}
  .slot{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .slot input{flex:1}
  .slot button{padding:8px 10px;font-size:12px;flex:0}
  /* 转盘 */
  .wheel-wrap{position:relative;display:flex;justify-content:center;padding:10px 0}
  canvas#wheel{max-width:100%;height:auto}
  .wheel-pointer{
    position:absolute;top:2px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
    border-top:20px solid var(--accent2);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  }
  .wheel-result{text-align:center;font-size:16px;font-weight:700;margin-top:8px;min-height:24px;color:var(--accent)}
  /* 猫咪 */
  #catCanvas{width:100%;height:300px;border-radius:14px;background:linear-gradient(#eaf0ff,#fdf6ee);display:block}
  .cat-bar{display:flex;gap:8px;margin-top:12px}
  .feed-btn{flex:1}
  .love-bubble{
    position:absolute;font-size:20px;pointer-events:none;animation:float 1.6s ease-out forwards;
  }
  @keyframes float{to{transform:translateY(-60px) scale(1.4);opacity:0}}
  /* 底部导航 */
  nav{
    position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;z-index:50;
  }
  nav a{
    flex:1;text-align:center;padding:10px 0 12px;font-size:11px;color:var(--sub);
    text-decoration:none;cursor:pointer;transition:.15s;
  }
  nav a .ico{display:block;font-size:19px;margin-bottom:2px}
  nav a.on{color:var(--accent)}
  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(30,26,20,.45);z-index:100;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .modal-mask.show{display:flex}
  .modal{
    background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 8px}
  .modal p{font-size:13px;color:var(--sub);line-height:1.6;margin:0 0 16px}
  .modal .list{max-height:180px;overflow-y:auto;margin-bottom:16px}
  .modal .list div{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>

<header>
  <h1>霖<span>今天学了吗</span></h1>
  <div class="today" id="todayLabel"></div>
</header>

<main>
  <!-- 打卡页 -->
  <section class="page active" id="page-home">
    <div class="card">
      <h3><span class="dot"></span>专注计时</h3>
      <div class="timer-wrap">
        <div class="timer-mode" id="timerMode">番茄专注 · 25 分钟</div>
        <div class="timer-num" id="timerNum">25:00</div>
        <div class="chips" style="justify-content:center;margin-top:8px">
          <div class="chip on" data-min="25">25分</div>
          <div class="chip" data-min="45">45分</div>
          <div class="chip" data-min="60">60分</div>
        </div>
        <div class="timer-ctrl">
          <button id="timerStart">开始</button>
          <button class="ghost" id="timerReset">重置</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>学习统计</h3>
      <div class="stat-grid">
        <div class="stat"><b id="stToday">0</b><span>今日分钟</span></div>
        <div class="stat"><b id="stTotal">0</b><span>累计分钟</span></div>
        <div class="stat"><b id="stDays">0</b><span>打卡天数</span></div>
      </div>
      <p class="muted" style="margin:12px 0 0">💡 完成一次专注即记为一次打卡，可去宠物页喂猫哦～</p>
    </div>
  </section>

  <!-- 待办页 -->
  <section class="page" id="page-todo">
    <div class="card">
      <h3><span class="dot"></span>添加事项</h3>
      <input id="taskName" placeholder="要做什么？比如：数学卷子">
      <div class="row" style="margin-top:8px">
        <input id="taskDDL" type="datetime-local" style="flex:1.4">
        <button id="taskAdd" style="flex:.7">添加</button>
      </div>
      <p class="muted" style="margin:8px 0 0">不填 DDL 也能加，系统会按紧急程度排序</p>
    </div>
    <div class="card">
      <h3><span class="dot"></span>未完成事项</h3>
      <div id="taskList"></div>
    </div>
  </section>

  <!-- 课表页 -->
  <section class="page" id="page-schedule">
    <div class="card">
      <h3><span class="dot"></span>我的课表</h3>
      <div class="week" id="weekPicker"></div>
      <div id="slotList"></div>
      <button class="ghost" id="slotAdd" style="width:100%;margin-top:6px">+ 添加一节</button>
    </div>
    <div class="card">
      <h3><span class="dot"></span>作息设置</h3>
      <div class="row" style="margin-bottom:8px">
        <div><p class="muted" style="margin:0 0 4px">起床</p><input id="wakeTime" type="time" value="07:00"></div>
        <div><p class="muted" style="margin:0 0 4px">睡觉</p><input id="sleepTime" type="time" value="23:00"></div>
      </div>
      <p class="muted" style="margin:0">系统会结合课表、作息和 DDL，给出"最晚必须动手"的提醒时间</p>
    </div>
  </section>

  <!-- 转盘页 -->
  <section class="page" id="page-wheel">
    <div class="card">
      <h3><span class="dot"></span>今天写哪个？</h3>
      <p class="muted" style="margin:0 0 6px">转盘只会放入"未完成且不紧急"的事项</p>
      <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
      </div>
      <div class="wheel-result" id="wheelResult"></div>
      <button id="wheelSpin" style="width:100%;margin-top:8px">转一下</button>
    </div>
  </section>

  <!-- 宠物页 -->
  <section class="page" id="page-cat">
    <div class="card" style="position:relative">
      <h3><span class="dot"></span>陪学小宠</h3>
      <canvas id="catCanvas"></canvas>
      <div class="chips" style="margin-top:10px" id="catBreed">
        <div class="chip on" data-breed="calico">三花</div>
        <div class="chip" data-breed="tabby">狸花</div>
        <div class="chip" data-breed="orange">橘猫</div>
        <div class="chip" data-breed="white">白猫</div>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="catName" placeholder="给小宠起个名字">
        <button class="ghost" id="catNameSave" style="flex:0;padding:10px 14px">保存</button>
      </div>
      <div class="cat-bar">
        <button class="feed-btn warm" id="feedCat">喂食 🍖</button>
        <button class="feed-btn ghost" id="petCat">摸摸 🐾</button>
      </div>
      <p class="muted" style="margin:10px 0 0" id="catMood">它正在看着你学习…</p>
    </div>
  </section>
</main>

<nav>
  <a class="on" data-page="home"><span class="ico">⏱</span>打卡</a>
  <a data-page="todo"><span class="ico">📝</span>待办</a>
  <a data-page="schedule"><span class="ico">📅</span>课表</a>
  <a data-page="wheel"><span class="ico">🎡</span>转盘</a>
  <a data-page="cat"><span class="ico">🐱</span>小宠</a>
</nav>

<!-- 进入弹窗 -->
<div class="modal-mask" id="entryModal">
  <div class="modal">
    <h3>霖，今天也要加油 🌱</h3>
    <p id="entryText">你有未完成事项：</p>
    <div class="list" id="entryList"></div>
    <button id="entryClose" style="width:100%">知道啦，开始学习</button>
  </div>
</div>

<script>
/* ================= 数据层 ================= */
const KEY = 'lin-study-v1';
const todayStr = () => new Date().toISOString().slice(0,10);

let store = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s) return s;
  }catch(e){}
  return {
    tasks: [],           // {id,name,ddl,done}
    schedule: {},        // {0..6: [{id,start,end,name}]}
    wake:'07:00', sleep:'23:00',
    studyLog: {},        // {date: minutes}
    checkinDays: [],     // 打卡日期数组
    cat:{breed:'calico', name:'', fed:0, mood:'idle'}
  };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ================= 页面切换 ================= */
$$('nav a').forEach(a=>{
  a.onclick = ()=>{
    $$('nav a').forEach(x=>x.classList.remove('on'));
    a.classList.add('on');
    $$('.page').forEach(p=>p.classList.remove('active'));
    $('#page-'+a.dataset.page).classList.add('active');
    if(a.dataset.page==='wheel') drawWheel();
    if(a.dataset.page==='cat') initCat();
  };
});

$('#todayLabel').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});

/* ================= 番茄钟 ================= */
let timer = { total:25*60, left:25*60, running:false, id:null };
function renderTimer(){
  const m = Math.floor(timer.left/60), s = timer.left%60;
  $('#timerNum').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
$$('.chip[data-min]').forEach(c=>{
  c.onclick = ()=>{
    if(timer.running) return;
    $$('.chip[data-min]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    timer.total = +c.dataset.min*60; timer.left = timer.total; renderTimer();
    $('#timerMode').textContent = `番茄专注 · ${c.dataset.min} 分钟`;
  };
});
$('#timerStart').onclick = ()=>{
  if(timer.running){
    clearInterval(timer.id); timer.running=false; $('#timerStart').textContent='开始';
    return;
  }
  timer.running = true; $('#timerStart').textContent='暂停';
  timer.id = setInterval(()=>{
    timer.left--;
    renderTimer();
    if(timer.left<=0){
      clearInterval(timer.id); timer.running=false; $('#timerStart').textContent='开始';
      onFocusDone(timer.total/60);
    }
  },1000);
};
$('#timerReset').onclick = ()=>{
  clearInterval(timer.id); timer.running=false; timer.left=timer.total;
  $('#timerStart').textContent='开始'; renderTimer();
};
function onFocusDone(min){
  const d = todayStr();
  store.studyLog[d] = (store.studyLog[d]||0) + min;
  if(!store.checkinDays.includes(d)) store.checkinDays.push(d);
  store.cat.fed = Math.min(store.cat.fed+1, 5);
  save(); renderStats();
  alert(`🎉 专注完成！记录 ${min} 分钟，猫咪有吃的啦～`);
}
function renderStats(){
  const d = todayStr();
  const todayMin = store.studyLog[d]||0;
  const totalMin = Object.values(store.studyLog).reduce((a,b)=>a+b,0);
  $('#stToday').textContent = todayMin;
  $('#stTotal').textContent = totalMin;
  $('#stDays').textContent = store.checkinDays.length;
}

/* ================= 待办 ================= */
function urgencyInfo(t){
  if(!t.ddl) return {label:'无截止', urgent:false, latest:'随时'};
  const now = Date.now();
  const ddl = new Date(t.ddl).getTime();
  const diffH = (ddl-now)/3600000;
  let latest = '';
  // 简单估算：留给执行 1 小时，加上睡觉时间约束
  const latestTs = ddl - 60*60*1000;
  const latestDate = new Date(latestTs);
  latest = latestDate.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  let label = '', urgent=false;
  if(diffH < 0){ label='已逾期'; urgent=true; }
  else if(diffH < 24){ label=`剩 ${Math.ceil(diffH)} 小时`; urgent=true; }
  else { label=`剩 ${Math.ceil(diffH/24)} 天`; urgent=false; }
  return {label, urgent, latest, diffH};
}
function renderTasks(){
  const list = $('#taskList');
  const arr = [...store.tasks].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const da=a.ddl?new Date(a.ddl).getTime():Infinity;
    const db=b.ddl?new Date(b.ddl).getTime():Infinity;
    return da-db;
  });
  if(!arr.length){ list.innerHTML='<p class="muted">还没有事项，去添加吧～</p>'; return; }
  list.innerHTML = arr.map(t=>{
    const u = urgencyInfo(t);
    return `<div class="task ${t.done?'done':''}" data-id="${t.id}">
      <div class="check">${t.done?'✓':''}</div>
      <div class="t-body">
        <div class="t-name">${escapeHtml(t.name)}</div>
        <div class="t-meta">
          ${t.ddl?`<span class="${u.urgent?'urgent':''}">⏰ ${u.label}</span>`:''}
          <span>最晚 ${u.latest} 动手</span>
        </div>
      </div>
      <button class="del">×</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.task').forEach(el=>{
    const id = el.dataset.id;
    el.querySelector('.check').onclick = ()=>{
      const t = store.tasks.find(x=>x.id==id);
      t.done = !t.done;
      if(t.done){ store.cat.fed = Math.min(store.cat.fed+1,5); }
      save(); renderTasks(); updateEntry();
    };
    el.querySelector('.del').onclick = ()=>{
      store.tasks = store.tasks.filter(x=>x.id!=id);
      save(); renderTasks();
    };
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#taskAdd').onclick = ()=>{
  const name = $('#taskName').value.trim();
  if(!name) return;
  store.tasks.push({id:Date.now(), name, ddl:$('#taskDDL').value||'', done:false});
  $('#taskName').value=''; $('#taskDDL').value='';
  save(); renderTasks();
};

/* ================= 课表 ================= */
const WEEK = ['日','一','二','三','四','五','六'];
let selDay = new Date().getDay();
function renderWeek(){
  $('#weekPicker').innerHTML = WEEK.map((w,i)=>
    `<div data-d="${i}" class="${i===selDay?'on':''}">${w}</div>`).join('');
  $('#weekPicker').querySelectorAll('div').forEach(d=>{
    d.onclick = ()=>{ selDay = +d.dataset.d; renderWeek(); renderSlots(); };
  });
}
function renderSlots(){
  const list = store.schedule[selDay]||[];
  $('#slotList').innerHTML = list.map(s=>`
    <div class="slot" data-id="${s.id}">
      <input type="time" value="${s.start}" class="s-start">
      <input type="time" value="${s.end}" class="s-end">
      <input placeholder="课程" value="${escapeHtml(s.name)}" class="s-name">
      <button class="del-slot">×</button>
    </div>`).join('') || '<p class="muted">这天还没课～</p>';
  $('#slotList').querySelectorAll('.slot').forEach(el=>{
    const id = el.dataset.id;
    const s = store.schedule[selDay].find(x=>x.id==id);
    el.querySelector('.s-start').onchange = e=>{s.start=e.target.value;save();};
    el.querySelector('.s-end').onchange = e=>{s.end=e.target.value;save();};
    el.querySelector('.s-name').onchange = e=>{s.name=e.target.value;save();};
    el.querySelector('.del-slot').onclick = ()=>{
      store.schedule[selDay] = store.schedule[selDay].filter(x=>x.id!=id);
      save(); renderSlots();
    };
  });
}
$('#slotAdd').onclick = ()=>{
  store.schedule[selDay] = store.schedule[selDay]||[];
  store.schedule[selDay].push({id:Date.now(), start:'08:00', end:'09:00', name:''});
  save(); renderSlots();
};
$('#wakeTime').onchange = e=>{store.wake=e.target.value;save();};
$('#sleepTime').onchange = e=>{store.sleep=e.target.value;save();};

/* ================= 转盘 ================= */
let wheelRot = 0, spinning = false;
function getWheelTasks(){
  return store.tasks.filter(t=>!t.done).filter(t=>{
    const u = urgencyInfo(t);
    return !u.urgent;
  });
}
function drawWheel(){
  const cv = $('#wheel'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, cx=W/2, cy=H/2, r=Math.min(W,H)/2-8;
  ctx.clearRect(0,0,W,H);
  const tasks = getWheelTasks();
  if(!tasks.length){
    ctx.fillStyle='#f0ede6'; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
    ctx.fillStyle='#8a857c'; ctx.font='14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('暂无待决定事项', cx, cy+4);
    return;
  }
  const n = tasks.length, per = Math.PI*2/n;
  const colors = ['#6c8cff','#ff9f6b','#4bb98a','#e07fb5','#b08cff','#5bc9d6','#f2c14e'];
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(wheelRot);
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,r,i*per,(i+1)*per); ctx.closePath();
    ctx.fillStyle = colors[i%colors.length]; ctx.fill();
    ctx.save(); ctx.rotate(i*per+per/2);
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='right';
    const label = tasks[i].name.length>6 ? tasks[i].name.slice(0,6)+'…' : tasks[i].name;
    ctx.fillText(label, r-14, 4);
    ctx.restore();
  }
  ctx.restore();
}
$('#wheelSpin').onclick = ()=>{
  if(spinning) return;
  const tasks = getWheelTasks();
  if(!tasks.length){ alert('没有可转的事项'); return; }
  spinning = true;
  const target = wheelRot + Math.PI*2*6 + Math.random()*Math.PI*2;
  const start = wheelRot, t0 = performance.now(), dur = 3200;
  function anim(t){
    const p = Math.min((t-t0)/dur,1);
    const ease = 1-Math.pow(1-p,3);
    wheelRot = start + (target-start)*ease;
    drawWheel();
    if(p<1) requestAnimationFrame(anim);
    else{
      spinning = false;
      // 计算指针（顶部）指向哪个扇区
      const n = tasks.length, per = Math.PI*2/n;
      let ang = ((-wheelRot % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      // 指针在 -90°(顶部)，扇区从 -90° 逆时针展开
      let idx = Math.floor(((Math.PI*1.5 - wheelRot) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) / per);
      idx = (n - idx) % n;
      const pick = tasks[idx];
      $('#wheelResult').textContent = '👉 就决定是你了：' + pick.name;
    }
  }
  requestAnimationFrame(anim);
};

/* ================= 3D 猫咪 ================= */
let catThree = null;
function initCat(){
  if(catThree) return;
  const cv = $('#catCanvas');
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = 300 * devicePixelRatio;
  const THREE = window.THREE;
  if(!THREE){
    // 动态加载 three
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/three@0.160.0/build/three.min.js';
    s.onload = ()=>{ window.THREE = THREE; initCat(); };
    document.head.appendChild(s);
    return;
  }
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, cv.width/cv.height, 0.1, 100);
  camera.position.set(0, 1.6, 6);
  camera.lookAt(0, 0.6, 0);
  const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  renderer.setSize(cv.width, cv.height, false);

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(3,5,4); scene.add(dl);
  const pl = new THREE.PointLight(0xffd7a8, 1.5, 20); pl.position.set(-3,2,3); scene.add(pl);

  const cat = new THREE.Group();
  scene.add(cat);

  const palette = {
    calico:{body:0xf5f0e6, patch1:0xe8955a, patch2:0x3a3330, nose:0xffb3b3},
    tabby:{body:0x9a8a72, patch1:0x5c5040, patch2:0x3a3330, nose:0xffc4c4},
    orange:{body:0xf2a44e, patch1:0xe08b34, patch2:0xffffff, nose:0xffb3b3},
    white:{body:0xf7f4ee, patch1:0xe8e2d6, patch2:0xffffff, nose:0xffb3b3},
  };
  const p = palette[store.cat.breed] || palette.calico;

  // 身体
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 32),
    new THREE.MeshStandardMaterial({color:p.body, roughness:.8})
  );
  body.scale.set(1, 1.1, 1); body.position.y = 0.6; cat.add(body);
  // 花斑
  const patch = new THREE.Mesh(
    new THREE.SphereGeometry(0.55, 24, 24),
    new THREE.MeshStandardMaterial({color:p.patch1, roughness:.8})
  );
  patch.scale.set(1,1.1,.5); patch.position.set(0.4,0.7,0.7); cat.add(patch);
  const patch2 = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 24, 24),
    new THREE.MeshStandardMaterial({color:p.patch2, roughness:.8})
  );
  patch2.position.set(-0.5,0.4,0.65); cat.add(patch2);
  // 头
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.62, 32, 32),
    new THREE.MeshStandardMaterial({color:p.body, roughness:.8})
  );
  head.position.set(0, 1.7, 0.1); cat.add(head);
  // 耳朵
  const earGeo = new THREE.ConeGeometry(0.22, 0.42, 16);
  const earMat = new THREE.MeshStandardMaterial({color:p.patch1, roughness:.8});
  const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.38,2.2,0.1); cat.add(earL);
  const earR = new THREE.Mesh(earGeo, earMat); earR.position.set(0.38,2.2,0.1); cat.add(earR);
  // 眼睛
  const eyeMat = new THREE.MeshStandardMaterial({color:0x2c2a26, roughness:.2});
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16), eyeMat);
  eyeL.position.set(-0.22,1.78,0.62); cat.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16), eyeMat);
  eyeR.position.set(0.22,1.78,0.62); cat.add(eyeR);
  // 高光
  const hiMat = new THREE.MeshBasicMaterial({color:0xffffff});
  const hiL = new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8), hiMat);
  hiL.position.set(-0.20,1.81,0.69); cat.add(hiL);
  const hiR = new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8), hiMat);
  hiR.position.set(0.24,1.81,0.69); cat.add(hiR);
  // 鼻子
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16),
    new THREE.MeshStandardMaterial({color:p.nose}));
  nose.position.set(0,1.62,0.7); cat.add(nose);
  // 尾巴
  const tail = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.09, 12, 40, Math.PI*1.4),
    new THREE.MeshStandardMaterial({color:p.body, roughness:.8})
  );
  tail.position.set(-0.9, 0.7, -0.4);
  tail.rotation.z = Math.PI*0.15; cat.add(tail);
  // 脚
  const footMat = new THREE.MeshStandardMaterial({color:p.body, roughness:.8});
  [[-0.55,0.1,0.55],[0.55,0.1,0.55]].forEach(([x,y,z])=>{
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.25,16,16), footMat);
    f.position.set(x,y,z); cat.add(f);
  });

  catThree = {scene, camera, renderer, cat, head, eyeL, eyeR, tail, t:0, happy:0};

  // 与用户互动
  const moodEl = $('#catMood');
  function setMood(txt){ moodEl.textContent = txt; }

  $('#feedCat').onclick = ()=>{
    if(store.cat.fed<=0){ setMood('它还不饿，先完成一点学习再来吧～'); return; }
    store.cat.fed--; save();
    catThree.happy = 1;
    setMood('😋 好吃！喵～ 谢谢你！');
    bubble('🍖');
  };
  $('#petCat').onclick = ()=>{
    catThree.happy = 1;
    const msgs = ['咕噜咕噜～','蹭蹭你～','喵？','舒服！','再摸摸～'];
    setMood('😺 ' + msgs[Math.floor(Math.random()*msgs.length)]);
    bubble('❤️');
  };
  $('#catNameSave').onclick = ()=>{
    store.cat.name = $('#catName').value.trim();
    save(); setMood(store.cat.name? `${store.cat.name} 记住了自己的名字～` : '它还没名字哦');
  };
  if(store.cat.name) $('#catName').value = store.cat.name;

  function bubble(emoji){
    const wrap = $('#catCanvas').parentElement;
    const el = document.createElement('div');
    el.className='love-bubble';
    el.textContent = emoji;
    el.style.left = (40+Math.random()*60)+'%';
    el.style.top = '40%';
    el.style.position='absolute';
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),1600);
  }

  function animate(){
    requestAnimationFrame(animate);
    catThree.t += 0.016;
    cat.rotation.y = Math.sin(catThree.t*0.6)*0.25;
    // 呼吸
    body.scale.y = 1.1 + Math.sin(catThree.t*2)*0.02;
    // 尾巴摆动
    tail.rotation.z = Math.PI*0.15 + Math.sin(catThree.t*3)*0.25;
    // 开心跳跃
    if(catThree.happy>0){
      catThree.happy -= 0.03;
      cat.position.y = Math.abs(Math.sin(catThree.t*10))*0.15;
    } else {
      cat.position.y = 0;
    }
    // 眨眼
    const blink = Math.sin(catThree.t*0.7) > 0.98 ? 0.2 : 1;
    eyeL.scale.y = blink; eyeR.scale.y = blink;
    renderer.render(scene, camera);
  }
  animate();

  // 品种切换
  $('#catBreed').querySelectorAll('.chip').forEach(c=>{
    if(c.dataset.breed===store.cat.breed) c.classList.add('on'); else c.classList.remove('on');
    c.onclick = ()=>{
      store.cat.breed = c.dataset.breed; save();
      catThree = null; // 重新初始化
      $('#catCanvas').parentElement.querySelectorAll('.love-bubble').forEach(x=>x.remove());
      // 清空 canvas
      const ctx = $('#catCanvas').getContext('2d');
      ctx && ctx.clearRect(0,0,999,999);
      initCat();
    };
  });
}
if(store.cat.name) $('#catName').value = store.cat.name;

/* ================= 进入弹窗 ================= */
function updateEntry(){
  const pending = store.tasks.filter(t=>!t.done);
  const urgent = pending.filter(t=>urgencyInfo(t).urgent);
  const list = $('#entryList');
  if(!pending.length){
    $('#entryText').textContent = '今天没有待办，去打卡学习或者陪陪小宠吧～';
    list.innerHTML = '';
  } else {
    $('#entryText').textContent = `你有 ${pending.length} 项未完成，其中 ${urgent.length} 项紧急：`;
    const show = urgent.length?urgent:pending;
    list.innerHTML = show.slice(0,5).map(t=>{
      const u = urgencyInfo(t);
      return `<div>${u.urgent?'🔴':'🟡'} ${escapeHtml(t.name)} · ${u.label}</div>`;
    }).join('');
  }
}
setTimeout(()=>{ updateEntry(); $('#entryModal').classList.add('show'); }, 500);
$('#entryClose').onclick = ()=> $('#entryModal').classList.remove('show');

$('#wakeTime').value = store.wake; $('#sleepTime').value = store.sleep;
setTimeout(drawWheel, 100);
window.addEventListener('resize', ()=>{ catThree && catThree.renderer && catThree.renderer.setSize($('#catCanvas').clientWidth*devicePixelRatio, 300*devicePixelRatio, false); });

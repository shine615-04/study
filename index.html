<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业规划 + 番茄专注</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system}
.pet{font-size:4rem;line-height:1}
.timer-num{font-size:5rem;font-weight:bold;letter-spacing:2px}
.focus-page{position:fixed;inset:0;background:#f8fafc;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.focus-page.active{display:flex}
.bubble{background:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 2px 8px #00000015}
input[type="color"]{width:40px;height:40px;border:none;border-radius:50%;cursor:pointer}
</style>
</head>
<body class="bg-slate-50 p-4 max-w-xl mx-auto">
<h1 class="text-2xl font-bold mb-4">📚 作业规划工具</h1>

<div class="mb-4 flex items-center gap-2">
<span>主题色：</span>
<input id="themeColor" type="color" value="#60a5fa">
</div>

<div class="bg-white rounded-xl p-4 shadow mb-4">
<h2 class="font-semibold mb-2">选择宠物</h2>
<div class="flex gap-4">
<button onclick="selectPet('🐱','小猫')" class="px-4 py-2 rounded-lg border pet-btn">🐱 猫猫</button>
<button onclick="selectPet('🐶','小狗')" class="px-4 py-2 rounded-lg border pet-btn">🐶 狗狗</button>
</div>
<div class="mt-3 flex items-center gap-2">
<span id="petShow" class="pet">🐱</span>
<span id="petTalk" class="bubble">你好呀，快添加任务吧！</span>
</div>
</div>

<div class="bg-white rounded-xl p-4 shadow mb-4">
<h2 class="font-semibold mb-2">新增任务</h2>
<div class="grid gap-2">
<input id="taskName" placeholder="作业名称" class="border rounded px-3 py-2">
<input id="taskDeadline" type="datetime-local" class="border rounded px-3 py-2">
<input id="taskHour" type="number" min="0.5" step="0.5" placeholder="预估耗时(小时)" class="border rounded px-3 py-2">
<button onclick="addTask()" class="bg-blue-400 text-white py-2 rounded-lg">添加任务</button>
</div>
</div>

<div class="bg-white rounded-xl p-4 shadow mb-4">
<h2 class="font-semibold mb-2">任务列表（按紧急排序）</h2>
<div id="taskList" class="mt-2 space-y-2"></div>
</div>

<!-- 番茄专注页 -->
<div class="focus-page" id="focusPage">
<div id="focusPet" class="pet">🐱</div>
<div class="timer-num" id="timerText">25:00</div>
<div class="text-lg" id="focusTaskName"></div>
<div class="flex gap-3">
<button onclick="startTimer()" class="px-5 py-2 bg-green-400 rounded-lg text-white">开始</button>
<button onclick="pauseTimer()" class="px-5 py-2 bg-amber-400 rounded-lg text-white">暂停</button>
<button onclick="stopTimer()" class="px-5 py-2 bg-red-400 rounded-lg text-white">退出专注</button>
</div>
<div class="mt-2">
<label>白噪音：</label>
<select id="bgAudio">
<option value="">无</option>
<option value="rain">雨声</option>
<option value="cafe">咖啡馆</option>
<option value="forest">森林</option>
</select>
</div>
</div>

<audio id="rainAudio" loop><source src="https://assets.mixkit.co/sfx/preview/mixkit-light-rain-ambience-1170.mp3">
<audio id="cafeAudio" loop><source src="https://assets.mixkit.co/sfx/preview/mixkit-restaurant-and-cafe-ambience-1201.mp3">
<audio id="forestAudio" loop><source src="https://assets.mixkit.co/sfx/preview/mixkit-forest-stream-ambience-1163.mp3">

<script>
let petEmoji = "🐱";
let petName = "小猫";
let tasks = JSON.parse(localStorage.getItem("taskList")) || [];
let timerInterval = null;
let remainSec = 25 * 60;
let currentFocusTask = null;
let audioEl = null;

// 主题色
const colorInput = document.getElementById("themeColor");
colorInput.oninput = ()=>{
  document.documentElement.style.setProperty("--tc", colorInput.value);
  document.querySelectorAll(".bg-blue-400").forEach(el=>el.style.backgroundColor=colorInput.value);
}

function selectPet(emoji,name){
  petEmoji = emoji; petName = name;
  document.getElementById("petShow").textContent = petEmoji;
  document.getElementById("petTalk").textContent = `${petName}陪你加油！`;
  localStorage.setItem("pet",JSON.stringify({emoji,name}));
}
const savedPet = JSON.parse(localStorage.getItem("pet"));
if(savedPet) selectPet(savedPet.emoji,savedPet.name);

// 任务
function addTask(){
  const name = document.getElementById("taskName").value.trim();
  const dl = document.getElementById("taskDeadline").value;
  const hour = Number(document.getElementById("taskHour").value);
  if(!name||!dl||!hour) return alert("填完整");
  const task = {id:Date.now(),name,deadline:dl,hour,startLatest:new Date(dl).getTime() - hour*3600*1000,done:false};
  tasks.push(task);
  saveTask(); renderTask();
}
function saveTask(){localStorage.setItem("taskList",JSON.stringify(tasks))}
function renderTask(){
  tasks.sort((a,b)=>a.startLatest - b.startLatest);
  const wrap = document.getElementById("taskList");
  wrap.innerHTML = "";
  tasks.forEach(t=>{
    const div = document.createElement("div");
    div.className = "p-2 border rounded flex justify-between items-center";
    div.innerHTML = `
    <div>
    <div>${t.name}</div>
    <div class="text-xs text-slate-500">最晚开始：${new Date(t.startLatest).toLocaleString()}</div>
    </div>
    <div class="flex gap-2">
    <button onclick="openFocus(${t.id})" class="text-sm bg-green-100 px-2 py-1 rounded">专注</button>
    <button onclick="doneTask(${t.id})" class="text-sm bg-sky-100 px-2 py-1 rounded">完成</button>
    <button onclick="delTask(${t.id})" class="text-sm bg-red-100 px-2 py-1 rounded">删</button>
    </div>`;
    wrap.appendChild(div);
  })
}
function doneTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = true;
  document.getElementById("petTalk").textContent = "太棒啦！给"+petName+"喂零食✨";
  saveTask(); renderTask();
}
function delTask(id){
  tasks = tasks.filter(x=>x.id!==id); saveTask(); renderTask();
}

// 番茄钟
function openFocus(id){
  currentFocusTask = tasks.find(x=>x.id===id);
  if(!currentFocusTask) return;
  remainSec = 25*60;
  document.getElementById("focusTaskName").textContent = currentFocusTask.name;
  document.getElementById("focusPet").textContent = petEmoji;
  document.getElementById("focusPage").classList.add("active");
  renderTimer();
}
function renderTimer(){
  const m = Math.floor(remainSec/60).toString().padStart(2,"0");
  const s = (remainSec%60).toString().padStart(2,"0");
  document.getElementById("timerText").innerText = `${m}:${s}`;
}
function startTimer(){
  if(timerInterval) return;
  const soundType = document.getElementById("bgAudio").value;
  if(soundType){
    if(audioEl) audioEl.pause();
    audioEl = document.getElementById(soundType+"Audio");
    audioEl.play();
  }
  timerInterval = setInterval(()=>{
    remainSec--; renderTimer();
    if(remainSec<=0){
      pauseTimer();
      alert("时间到！");
      vibrateOnce();
    }
  },1000)
}
function pauseTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  if(audioEl) audioEl.pause();
  // ====== 暂停触发振动（重点新增）======
  vibrateOnce();
}
function stopTimer(){
  pauseTimer();
  document.getElementById("focusPage").classList.remove("active");
}
// 振动函数，兼容判断，不会在不支持的设备报错
function vibrateOnce(){
  if('vibrate' in navigator){
    // 震动模式：短震两下，手感柔和
    navigator.vibrate([120,80,120]);
  }
}

renderTask();
</script>
</body>
</html>

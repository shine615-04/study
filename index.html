<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>作业规划小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --theme:#6366f1;
    }
    *{
      transition: all 0.25s ease;
    }
    .theme-bg{
      background-color: var(--theme);
    }
    .theme-text{
      color: var(--theme);
    }
    .theme-border{
      border-color: var(--theme);
    }
    .focus-page{
      position:fixed;
      inset:0;
      z-index:99;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.85);
      color:#fff;
    }
    .focus-page.active{
      display:flex;
    }
    .pet-talk{
      position:relative;
      background:#fff;
      color:#333;
      padding:8px 12px;
      border-radius:12px;
      font-size:14px;
    }
    .wheel-container{
      position:relative;
      width:260px;
      height:260px;
    }
    #wheel{
      width:100%;
      height:100%;
      border-radius:50%;
      border:4px solid var(--theme);
      transition: transform 4s cubic-bezier(0.2,0.8,0.2,1);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50" id="mainBody">
  <div class="max-w-4xl mx-auto p-4 space-y-6">
    <div class="flex flex-wrap justify-between items-center gap-3">
      <h1 class="text-2xl font-bold theme-text">📚 作业规划小助手</h1>
      <div class="flex gap-2 flex-wrap items-center">
        <label class="text-sm">主题色：</label>
        <input type="color" id="colorPicker" value="#6366f1" class="w-8 h-8 cursor-pointer rounded">
        <label class="text-sm">背景图：</label>
        <input type="file" id="bgUpload" accept="image/*" class="text-sm">
      </div>
    </div>

    <!-- 宠物区 -->
    <div class="bg-white rounded-xl shadow p-4 flex items-center gap-4">
      <div>
        <div class="text-5xl" id="petEmoji">🐱</div>
        <div class="pet-talk mt-2 hidden" id="petMsg">太棒啦，任务完成！</div>
      </div>
      <div class="space-y-2">
        <div class="flex gap-2">
          <button onclick="setPet('cat')" class="px-3 py-1 rounded border theme-border">猫咪 🐱</button>
          <button onclick="setPet('dog')" class="px-3 py-1 rounded border theme-border">小狗 🐶</button>
        </div>
        <div>宠物名字：<input id="petName" class="border rounded px-2 py-1 w-28" onchange="savePet()"></div>
      </div>
    </div>

    <!-- 添加任务 -->
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-semibold">➕ 添加作业任务</h2>
      <div class="grid sm:grid-cols-2 gap-3">
        <input type="text" id="taskName" placeholder="作业名称" class="border rounded px-3 py-2">
        <input type="datetime-local" id="deadline" class="border rounded px-3 py-2">
        <input type="number" id="needHour" placeholder="预估耗时(小时)" step="0.5" min="0.25" class="border rounded px-3 py-2">
        <button onclick="addTask()" class="theme-bg text-white rounded">添加任务</button>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold mb-3">📋 任务清单（按紧急排序）</h2>
      <div id="taskList" class="space-y-2"></div>
    </div>

    <!-- 转盘 -->
    <div class="bg-white rounded-xl shadow p-4 flex flex-col items-center">
      <h2 class="font-semibold mb-3">🎲 随机转盘</h2>
      <div class="wheel-container">
        <svg id="wheel" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="48" fill="none" stroke="#ddd" stroke-width="1"/>
          <text x="50" y="50" text-anchor="middle" dominant-baseline="middle" font-size="6">待转</text>
        </svg>
      </div>
      <button onclick="spinWheel()" class="theme-bg text-white px-4 py-2 rounded mt-3">转动转盘</button>
      <div id="wheelResult" class="mt-2 theme-text font-medium"></div>
    </div>
  </div>

  <!-- 专注全屏页 -->
  <div class="focus-page" id="focusPage">
    <div class="text-7xl font-mono mb-8" id="timerText">25:00</div>
    <div class="flex gap-3 mb-6">
      <button onclick="startTimer()" class="px-5 py-2 rounded bg-green-500 text-white">开始</button>
      <button onclick="pauseTimer()" class="px-5 py-2 rounded bg-amber-500 text-white">暂停</button>
      <button onclick="exitTimer()" class="px-5 py-2 rounded bg-red-500 text-white">退出</button>
    </div>
    <div class="mb-4">
      <span class="mr-2">白噪音：</span>
      <select id="noiseSelect" class="px-2 py-1 rounded">
        <option value="">关闭</option>
        <option value="rain">雨声</option>
        <option value="forest">森林</option>
        <option value="wave">海浪</option>
      </select>
    </div>
    <audio id="noiseAudio" loop>
  </div>

<script>
// 数据
let taskList = JSON.parse(localStorage.getItem("tasks"))||[];
let petType = localStorage.getItem("petType")||"cat";
let petNick = localStorage.getItem("petNick")||"小宝贝";
let themeColor = localStorage.getItem("themeColor")||"#6366f1";
let bgImg = localStorage.getItem("bgImg")||"";

let focusMin = 25;
let remainSec = focusMin*60;
let timerRun = false;
let timerId = null;
let audioCtx;

// 初始化
document.documentElement.style.setProperty('--theme',themeColor);
document.getElementById("colorPicker").value=themeColor;
if(bgImg) document.getElementById("mainBody").style.backgroundImage=`url(${bgImg})`;
setPet(petType,false);
document.getElementById("petName").value=petNick;
renderTask();

// 主题色
document.getElementById("colorPicker").oninput=e=>{
  themeColor=e.target.value;
  document.documentElement.style.setProperty('--theme',themeColor);
  localStorage.setItem("themeColor",themeColor);
}
// 背景上传
document.getElementById("bgUpload").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    bgImg=ev.target.result;
    document.getElementById("mainBody").style.backgroundImage=`url(${bgImg})`;
    localStorage.setItem("bgImg",bgImg);
  }
  r.readAsDataURL(f);
}

// 宠物
function setPet(type,save=true){
  petType=type;
  document.getElementById("petEmoji").innerText=type==="cat"?"🐱":"🐶";
  if(save) savePet();
}
function savePet(){
  petNick=document.getElementById("petName").value;
  localStorage.setItem("petType",petType);
  localStorage.setItem("petNick",petNick);
}
function showPetTalk(txt){
  const el=document.getElementById("petMsg");
  el.innerText=txt;
  el.classList.remove("hidden");
  setTimeout(()=>el.classList.add("hidden"),2200);
}

// 任务
function addTask(){
  const name=document.getElementById("taskName").value.trim();
  const dl=document.getElementById("deadline").value;
  const hour=Number(document.getElementById("needHour").value);
  if(!name||!dl||!hour) return alert("信息填完整");
  const dlTime=new Date(dl).getTime();
  const latestStart=dlTime-hour*3600000;
  taskList.push({name,dl,dlTime,hour,latestStart,done:false});
  saveTask();
  renderTask();
  document.getElementById("taskName").value="";
}
function saveTask(){
  localStorage.setItem("tasks",JSON.stringify(taskList));
}
function renderTask(){
  const wrap=document.getElementById("taskList");
  taskList.sort((a,b)=>a.latestStart-b.latestStart);
  wrap.innerHTML="";
  taskList.forEach((t,idx)=>{
    const div=document.createElement("div");
    div.className="p-3 border rounded flex justify-between items-center";
    div.innerHTML=`
      <div>
        <div class="${t.done?'line-through opacity-60':''}">${t.name}</div>
        <div class="text-xs text-gray-500">截止：${t.dl}｜最晚开始：${new Date(t.latestStart).toLocaleString()}</div>
      </div>
      <div class="flex gap-2">
        <button onclick="openFocus(${idx})" class="text-sm px-2 py-1 theme-bg text-white rounded">专注</button>
        <button onclick="finishTask(${idx})" class="text-sm px-2 py-1 bg-green-400 text-white rounded">完成</button>
        <button onclick="delTask(${idx})" class="text-sm px-2 py-1 bg-red-400 text-white rounded">删除</button>
      </div>
    `;
    wrap.appendChild(div);
  })
}
function finishTask(i){
  taskList[i].done=true;
  saveTask();renderTask();
  showPetTalk("做得太棒啦🥳");
}
function delTask(i){
  taskList.splice(i,1);
  saveTask();renderTask();
}

// 番茄专注
function openFocus(idx){
  document.getElementById("focusPage").classList.add("active");
  remainSec=25*60;
  updateTimerText();
  timerRun=false;
  if(timerId) clearInterval(timerId);
}
function startTimer(){
  if(timerRun) return;
  timerRun=true;
  timerId=setInterval(()=>{
    remainSec--;
    updateTimerText();
    if(remainSec<=0){
      clearInterval(timerId);
      timerRun=false;
      alert("专注时间结束！");
    }
  },1000)
}
function pauseTimer(){
  if(!timerRun) return;
  clearInterval(timerId);
  timerRun=false;
  if(navigator.vibrate) navigator.vibrate(150);
}
function exitTimer(){
  clearInterval(timerId);
  timerRun=false;
  remainSec=25*60;
  updateTimerText();
  document.getElementById("focusPage").classList.remove("active");
  document.getElementById("noiseAudio").pause();
}
function updateTimerText(){
  const m=Math.floor(remainSec/60);
  const s=remainSec%60;
  document.getElementById("timerText").innerText=String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
}

// 白噪音简易模拟
document.getElementById("noiseSelect").onchange=async e=>{
  const sel=e.target.value;
  const aud=document.getElementById("noiseAudio");
  if(!sel){aud.pause();return;}
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  aud.src="";
  aud.pause();
  const buf=await makeNoise(sel);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  src.loop=true;
  src.connect(audioCtx.destination);
  src.start();
}
async function makeNoise(type){
  const dur=3;
  const rate=audioCtx.sampleRate;
  const buf=audioCtx.createBuffer(1,rate*dur,rate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    if(type==="rain") d[i]=(Math.random()-0.5)*0.25;
    else if(type==="forest") d[i]=(Math.random()-0.5)*0.18;
    else d[i]=(Math.random()-0.5)*0.22;
  }
  return buf;
}

// 转盘
let spinDeg=0;
function spinWheel(){
  spinDeg += 1080 + Math.random()*720;
  document.getElementById("wheel").style.transform=`rotate(${spinDeg}deg)`;
  setTimeout(()=>{
    const list=taskList.filter(x=>!x.done);
    if(list.length===0) document.getElementById("wheelResult").innerText="暂无待办任务";
    else {
      const pick=list[Math.floor(Math.random()*list.length)];
      document.getElementById("wheelResult").innerText="选中："+pick.name;
    }
  },4000)
}
</script>
</body>
</html>
